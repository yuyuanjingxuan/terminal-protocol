<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Protocol</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
    }

    #gameCanvas {
      background-color: #000;
      border: 2px solid #444;
    }

    #uiPanel {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
    }

    #towerBar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .tower-btn {
      width: 52px;
      height: 52px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .tower-btn:hover {
      border-color: #00f0ff;
    }

    .tower-btn.selected {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .tower-btn .key {
      font-size: 9px;
      color: #888;
    }

    .tower-btn .cost {
      font-size: 10px;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="uiPanel">
      <div id="resources">Resources: 100</div>
      <div id="health">Health: 10</div>
      <div id="waveInfo">Wave: 0/0</div>
    </div>
    <div id="towerBar">
      <button class="tower-btn selected" data-type="laser" style="border-color:#00f0ff"><span class="key">1</span>Laser<span class="cost">80</span></button>
      <button class="tower-btn" data-type="plasma" style="border-color:#00a2ff"><span class="key">2</span>Plasma<span class="cost">100</span></button>
      <button class="tower-btn" data-type="railgun" style="border-color:#0066ff"><span class="key">3</span>Railgun<span class="cost">150</span></button>
      <button class="tower-btn" data-type="cannon" style="border-color:#ff6600"><span class="key">4</span>Cannon<span class="cost">90</span></button>
      <button class="tower-btn" data-type="missile" style="border-color:#ff3300"><span class="key">5</span>Missile<span class="cost">75</span></button>
      <button class="tower-btn" data-type="bomb" style="border-color:#cc0000"><span class="key">6</span>Bomb<span class="cost">110</span></button>
      <button class="tower-btn" data-type="emp" style="border-color:#9c27b0"><span class="key">7</span>EMP<span class="cost">70</span></button>
      <button class="tower-btn" data-type="pulse" style="border-color:#673ab7"><span class="key">8</span>Pulse<span class="cost">90</span></button>
      <button class="tower-btn" data-type="disruptor" style="border-color:#3f51b5"><span class="key">9</span>Disruptor<span class="cost">85</span></button>
      <button class="tower-btn" data-type="repair" style="border-color:#4CAF50"><span class="key">0</span>Repair<span class="cost">60</span></button>
    </div>
  </div>

  <!-- Include all JavaScript files -->
  <script src="core/game.js"></script>
  <script src="core/input.js"></script>
  <script src="entities/tower.js"></script>
  <script src="entities/enemy.js"></script>
  <script src="entities/projectile.js"></script>
  <script src="systems/waveManager.js"></script>
  <script src="content/levels.js"></script>
  <script src="render/renderer.js"></script>
  <script src="audio/audioManager.js"></script>
  <script src="main.js"></script>
</body>
</html>
