<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="yuyuanjingxuan">
  <title>终端协议</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
    }

    #gameCanvas {
      display: block;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 110px);
      height: auto;
      background-color: #000;
      border: 2px solid #444;
    }

    #uiPanel {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: rgba(0, 0, 0, 0.45);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
    }

    #selectedInfo {
      display: none;
      margin-top: 4px;
      font-weight: bold;
    }

    #levelBar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .level-btn {
      width: 44px;
      height: 44px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }

    .level-btn:hover {
      border-color: #00f0ff;
    }

    .level-btn.active {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    #waveControls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .wave-btn,
    .speed-btn {
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 12px;
      padding: 6px 10px;
    }

    .wave-btn:hover,
    .speed-btn:hover {
      border-color: #00f0ff;
    }

    .wave-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .speed-btn.active {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    #towerBar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .tower-btn {
      width: 56px;
      height: 52px;
      padding: 0;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .tower-btn .tname {
      white-space: nowrap;
      line-height: 1.1;
    }

    .tower-btn:hover {
      border-color: #00f0ff;
    }

    .tower-btn.selected {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .tower-btn .key {
      font-size: 9px;
      color: #888;
    }

    .tower-btn .cost {
      font-size: 10px;
      color: #ffd700;
    }

    .level-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #techBtn {
      position: absolute;
      top: 62px;
      right: 10px;
      border: 2px solid #ffd700;
      border-radius: 6px;
      background: #1a1a2e;
      color: #ffd700;
      cursor: pointer;
      font-size: 12px;
      padding: 6px 10px;
    }

    #techBtn:hover {
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    .wave-btn.off {
      opacity: 0.4;
    }

    #techPanel {
      position: absolute;
      top: 96px;
      right: 10px;
      width: 300px;
      max-height: 460px;
      overflow-y: auto;
      background: rgba(10, 10, 26, 0.95);
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 12px;
      display: none;
      z-index: 10;
    }

    #techPanel.open {
      display: block;
    }

    #techPanel h3 {
      margin: 0 0 8px 0;
      color: #ffd700;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #techCloseBtn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 16px;
    }

    .tech-faction {
      margin-bottom: 10px;
    }

    .tech-faction-name {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tech-node {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 100%;
      text-align: left;
      border: 1px solid #444;
      border-radius: 5px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 11px;
      padding: 6px 8px;
      margin-bottom: 4px;
    }

    .tech-node:hover:not(:disabled) {
      border-color: #ffd700;
    }

    .tech-node.available {
      border-color: #ffd700;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    }

    .tech-node.unlocked {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.08);
      cursor: default;
    }

    .tech-node:disabled:not(.unlocked) {
      opacity: 0.45;
      cursor: default;
    }

    .tech-node-name {
      font-weight: bold;
    }

    .tech-node-desc {
      color: #aaa;
      font-size: 10px;
    }

    .tech-node-cost {
      color: #ffd700;
      font-size: 10px;
    }

    .tech-node.unlocked .tech-node-cost {
      color: #00ff88;
    }

    #saveControls {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      border-top: 1px solid #333;
      padding-top: 8px;
    }

    #saveControls button {
      flex: 1;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1a1a2e;
      color: #ccc;
      cursor: pointer;
      font-size: 10px;
      padding: 4px;
    }

    #saveControls button:hover {
      border-color: #00f0ff;
      color: white;
    }

    #saveMsg {
      margin-top: 6px;
      font-size: 11px;
      color: #00ff88;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    /* Full-canvas overlays (main menu + result screen) */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 18px;
      background: rgba(5, 5, 15, 0.88);
      z-index: 20;
      text-align: center;
      padding: 24px 0;
      overflow-y: auto;
    }

    /* Result screen content is short: auto margins keep it vertically centered */
    #resultScreen h1 {
      margin-top: auto;
    }

    #resultScreen .credit {
      margin-bottom: auto;
    }

    .overlay.show {
      display: flex;
    }

    .overlay h1 {
      margin: 0;
      font-size: 44px;
      letter-spacing: 4px;
      color: #00f0ff;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.7);
    }

    #menuLogo {
      width: 88px;
      height: 88px;
      margin-bottom: 2px;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.45));
    }

    .overlay .subtitle {
      margin: 0;
      color: #8899aa;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .menu-level-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .menu-level-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      width: 280px;
      padding: 12px 18px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .menu-level-btn:hover:not(:disabled) {
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .menu-level-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .menu-level-name {
      font-weight: bold;
      text-align: left;
    }

    .menu-level-status {
      font-size: 12px;
      color: #00ff88;
    }

    .menu-level-btn.locked .menu-level-status {
      color: #888;
    }

    .overlay .big-btn {
      padding: 12px 32px;
      font-size: 18px;
      border: 2px solid #00ff88;
      border-radius: 8px;
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      cursor: pointer;
      letter-spacing: 2px;
    }

    .overlay .big-btn:hover {
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.6);
    }

    .menu-difficulty {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .menu-difficulty .diff-label {
      color: #8899aa;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .diff-btn {
      padding: 6px 16px;
      font-size: 13px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: #8899aa;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .diff-btn:hover {
      border-color: #00f0ff;
      color: #00f0ff;
    }

    .diff-btn.active {
      border-color: #00ff88;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
    }

    .endless-btn {
      margin-top: 10px;
      padding: 10px 28px;
      font-size: 16px;
      border: 2px solid #e040fb;
      border-radius: 8px;
      background: rgba(224, 64, 251, 0.08);
      color: #e040fb;
      cursor: pointer;
      letter-spacing: 2px;
    }

    .endless-btn:hover:not(:disabled) {
      box-shadow: 0 0 14px rgba(224, 64, 251, 0.6);
    }

    .endless-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .endless-hint {
      margin: 4px 0 0 0;
      color: #556677;
      font-size: 12px;
      letter-spacing: 1px;
    }

    #resultTitle {
      font-size: 48px;
      letter-spacing: 4px;
      margin: 0;
    }

    #resultSubtitle {
      color: #ccc;
      font-size: 16px;
      margin: 0;
    }

    .result-buttons {
      display: flex;
      gap: 14px;
      margin-top: 10px;
    }

    .result-btn {
      padding: 10px 24px;
      font-size: 15px;
      border: 2px solid #444;
      border-radius: 8px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
    }

    .result-btn:hover {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .result-btn.primary {
      border-color: #00ff88;
      color: #00ff88;
    }

    .lang-btn {
      margin-top: 6px;
      padding: 8px 22px;
      font-size: 14px;
      border: 2px solid #8899aa;
      border-radius: 8px;
      background: rgba(136, 153, 170, 0.08);
      color: #8899aa;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .lang-btn:hover {
      border-color: #00f0ff;
      color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .lang-btn-inline {
      font-size: 12px;
      padding: 6px 10px;
    }

    .credit {
      margin: 2px 0 0 0;
      color: #556677;
      font-size: 12px;
      letter-spacing: 1px;
    }

    #towerTooltip {
      position: absolute;
      bottom: 78px;
      transform: translateX(-50%);
      background: rgba(10, 10, 26, 0.95);
      border: 1px solid #00f0ff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      line-height: 1.6;
      pointer-events: none;
      display: none;
      z-index: 30;
      white-space: nowrap;
      text-align: center;
    }

    #towerTooltip.show {
      display: block;
    }

    #towerTooltip .tt-cost {
      color: #ffd700;
    }

    #towerTooltip .tt-desc {
      color: #8899aa;
    }

    #towerTooltip .tt-counter {
      color: #4dd0e1;
    }

    #towerTooltip .tt-hint {
      color: #556677;
      font-size: 10px;
    }

    #toast {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 26, 0.9);
      border: 1px solid #00ff88;
      color: #00ff88;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 30;
    }

    #toast.show {
      opacity: 1;
    }

    /* Phase 7: time limit display */
    #timerDisplay {
      margin-top: 4px;
      font-weight: bold;
      color: #ffd54f;
    }

    /* Phase 7: tower upgrade panel (bottom-right) */
    #upgradePanel {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      background: rgba(10, 10, 26, 0.92);
      border: 2px solid #ffd54f;
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 150px;
      z-index: 15;
    }
    #upgradePanel .up-name {
      font-weight: bold;
      font-size: 14px;
      color: #ffd54f;
    }
    #upgradePanel .up-level {
      font-size: 12px;
      color: #ccc;
    }
    #upgradePanel .up-btn {
      border: 2px solid #00ff88;
      border-radius: 6px;
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      cursor: pointer;
      font-size: 13px;
      padding: 6px 10px;
    }
    #upgradePanel .up-btn:hover:not(:disabled) {
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    #upgradePanel .up-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Phase 7: briefing panel (top, semi-transparent, shown on level load) */
    #briefingPanel {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(5, 5, 15, 0.82);
      border-bottom: 2px solid #00f0ff;
      padding: 14px 24px;
      z-index: 25;
      text-align: center;
    }
    #briefingPanel.show { display: flex; }
    #briefingPanel .bf-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: #00f0ff;
      text-transform: uppercase;
    }
    #briefingPanel .bf-speaker {
      font-size: 13px;
      font-weight: bold;
      color: #4dd0e1;
    }
    #briefingPanel .bf-text {
      font-size: 15px;
      color: #e0e8f0;
      max-width: 640px;
      line-height: 1.5;
    }
    #briefingPanel .bf-btn {
      margin-top: 4px;
      border: 2px solid #00f0ff;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      cursor: pointer;
      font-size: 13px;
      padding: 6px 20px;
    }
    #briefingPanel .bf-btn:hover {
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* Phase 7: dialogue box (post-level, speaker + text + continue) */
    #dialogueBox {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: rgba(5, 5, 15, 0.7);
      z-index: 28;
    }
    #dialogueBox.show { display: flex; }
    #dialogueBox .dlg-card {
      width: 620px;
      max-width: 90%;
      background: rgba(10, 10, 26, 0.96);
      border: 2px solid #00f0ff;
      border-radius: 10px;
      padding: 18px 24px;
      margin-bottom: 40px;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.3);
    }
    #dialogueBox .dlg-speaker {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    #dialogueBox .dlg-text {
      font-size: 16px;
      color: #e0e8f0;
      line-height: 1.6;
      min-height: 48px;
    }
    #dialogueBox .dlg-btn {
      margin-top: 14px;
      align-self: flex-end;
      border: 2px solid #00f0ff;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      cursor: pointer;
      font-size: 13px;
      padding: 6px 20px;
    }
    #dialogueBox .dlg-btn:hover {
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* Phase 7: chapter menu (6 chapter cards × 6 level slots) */
    .menu-chapters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 8px;
      max-height: 340px;
      overflow-y: auto;
      padding: 4px;
    }
    .menu-chapter {
      border: 2px solid #334;
      border-radius: 8px;
      background: rgba(20, 20, 40, 0.6);
      padding: 8px;
    }
    .menu-chapter-header {
      font-size: 13px;
      font-weight: bold;
      color: #00f0ff;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 1px;
    }
    .menu-chapter.slots-locked .menu-chapter-header {
      color: #556;
    }
    .menu-chapter-slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    .menu-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 4px;
      border: 1px solid #444;
      border-radius: 5px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 11px;
      text-align: center;
    }
    .menu-slot:hover:not(:disabled) {
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }
    .menu-slot:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .menu-slot .slot-name {
      font-weight: bold;
      line-height: 1.1;
    }
    .menu-slot .slot-status {
      font-size: 9px;
      color: #00ff88;
    }
    .menu-slot.locked .slot-status { color: #888; }
    .menu-slot.done .slot-status { color: #00ff88; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="uiPanel">
      <div id="resources">资源: 150</div>
      <div id="health">生命值: 10</div>
      <div id="waveInfo">波次: 0/0</div>
      <div id="techPoints">科技点: 0</div>
      <div id="timerDisplay" style="display:none"></div>
      <div id="selectedInfo"></div>
    </div>
    <button id="techBtn">⚡ 科技</button>
    <div id="techPanel">
      <h3><span id="techPanelTitle">科技树</span> <button id="techCloseBtn" title="关闭">✕</button></h3>
      <div id="techNodes"></div>
      <div id="saveControls">
        <button id="exportSaveBtn">导出</button>
        <button id="importSaveBtn">导入</button>
        <button id="resetSaveBtn">重置</button>
      </div>
      <div id="saveMsg"></div>
    </div>
    <div id="waveControls">
      <button id="nextWaveBtn" class="wave-btn">下一波</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="3">3x</button>
      <button id="muteBtn" class="wave-btn" title="开关音效">🔊</button>
      <button id="musicBtn" class="wave-btn" title="开关音乐">🎵</button>
      <button id="langBtn2" class="wave-btn lang-btn-inline" title="Language">EN</button>
    </div>
    <div id="towerBar">
      <button class="tower-btn" data-type="laser" style="border-color:#00f0ff"><span class="key">1</span><span class="tname">激光</span><span class="cost">50</span></button>
      <button class="tower-btn" data-type="plasma" style="border-color:#00a2ff"><span class="key">2</span><span class="tname">等离子</span><span class="cost">75</span></button>
      <button class="tower-btn" data-type="railgun" style="border-color:#0066ff"><span class="key">3</span><span class="tname">轨道炮</span><span class="cost">120</span></button>
      <button class="tower-btn" data-type="cannon" style="border-color:#ff6600"><span class="key">4</span><span class="tname">加农炮</span><span class="cost">60</span></button>
      <button class="tower-btn" data-type="missile" style="border-color:#ff3300"><span class="key">5</span><span class="tname">导弹</span><span class="cost">55</span></button>
      <button class="tower-btn" data-type="bomb" style="border-color:#cc0000"><span class="key">6</span><span class="tname">炸弹</span><span class="cost">90</span></button>
      <button class="tower-btn" data-type="emp" style="border-color:#9c27b0"><span class="key">7</span><span class="tname">EMP</span><span class="cost">45</span></button>
      <button class="tower-btn" data-type="pulse" style="border-color:#673ab7"><span class="key">8</span><span class="tname">眩晕脉冲</span><span class="cost">70</span></button>
      <button class="tower-btn" data-type="disruptor" style="border-color:#3f51b5"><span class="key">9</span><span class="tname">干扰器</span><span class="cost">65</span></button>
      <button class="tower-btn" data-type="repair" style="border-color:#4CAF50"><span class="key">0</span><span class="tname">资源塔</span><span class="cost">120</span></button>
    </div>
    <div id="towerTooltip"></div>
    <div id="toast"></div>

    <!-- Phase 7: tower upgrade panel -->
    <div id="upgradePanel">
      <span class="up-name"></span>
      <span class="up-level"></span>
      <button class="up-btn"></button>
    </div>

    <!-- Phase 7: mission briefing (shown on level load) -->
    <div id="briefingPanel">
      <div class="bf-title"></div>
      <div class="bf-speaker"></div>
      <div class="bf-text"></div>
      <button class="bf-btn"></button>
    </div>

    <!-- Phase 7: post-level dialogue box -->
    <div id="dialogueBox">
      <div class="dlg-card">
        <div class="dlg-speaker"></div>
        <div class="dlg-text"></div>
        <button class="dlg-btn"></button>
      </div>
    </div>

    <!-- Main menu (level select) -->
    <div id="mainMenu" class="overlay">
      <svg id="menuLogo" viewBox="0 0 160 160" aria-label="Terminal Protocol">
        <defs>
          <linearGradient id="tp-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0d1420"/>
            <stop offset="1" stop-color="#070b12"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="152" height="152" rx="26" fill="url(#tp-bg)" stroke="#00f0ff" stroke-width="3"/>
        <polygon points="80,24 122,49 122,95 80,120 38,95 38,49" fill="none" stroke="#00f0ff" stroke-width="5.5" stroke-linejoin="round" opacity="0.95"/>
        <polygon points="80,39 109,56 109,89 80,106 51,89 51,56" fill="none" stroke="#00f0ff" stroke-width="1.8" opacity="0.35"/>
        <path d="M58 54 L84 80 L58 106" fill="none" stroke="#e8f6ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="95" y="68" width="17" height="24" fill="#00f0ff"/>
      </svg>
      <h1 id="menuTitle">终端协议</h1>
      <p class="subtitle" id="menuSubtitle">守护终端 · 抵御入侵</p>
      <button id="menuStartBtn" class="big-btn">▶ 开始游戏</button>
      <div class="menu-difficulty">
        <span class="diff-label" id="difficultyLabel">难度</span>
        <button class="diff-btn" data-diff="easy">简单</button>
        <button class="diff-btn active" data-diff="normal">普通</button>
        <button class="diff-btn" data-diff="hard">困难</button>
      </div>
      <button id="endlessBtn" class="endless-btn" disabled>∞ 无尽模式</button>
      <p class="endless-hint" id="endlessHint">🔒 通关全部关卡后解锁</p>
      <div id="menuLevelList" class="menu-level-list"></div>
      <button id="langBtn" class="lang-btn">English</button>
      <p class="credit">v0.1.0 · by yuyuanjingxuan</p>
    </div>

    <!-- Result screen (win / lose) -->
    <div id="resultScreen" class="overlay">
      <h1 id="resultTitle">关卡完成</h1>
      <p id="resultSubtitle"></p>
      <div class="result-buttons">
        <button id="resultRetryBtn" class="result-btn">↻ 重试</button>
        <button id="resultNextBtn" class="result-btn primary">下一关 ▶</button>
        <button id="resultMenuBtn" class="result-btn">⌂ 主菜单</button>
      </div>
      <p class="credit">by yuyuanjingxuan</p>
    </div>
  </div>

  <!-- Include all JavaScript files (i18n.js + balance.js first: other scripts read them) -->
  <script src="content/i18n.js"></script>
  <script src="content/balance.js"></script>
  <script src="core/game.js"></script>
  <script src="core/input.js"></script>
  <script src="entities/tower.js"></script>
  <script src="entities/enemy.js"></script>
  <script src="entities/projectile.js"></script>
  <script src="systems/waveManager.js"></script>
  <script src="systems/techTree.js"></script>
  <script src="systems/saveSystem.js"></script>
  <script src="content/levels.js"></script>
  <script src="content/story.js"></script>
  <script src="render/renderer.js"></script>
  <script src="render/effects.js"></script>
  <script src="audio/audioManager.js"></script>
  <script src="main.js"></script>
</body>
</html>
