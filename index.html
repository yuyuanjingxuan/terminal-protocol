<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Protocol</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
    }

    #gameCanvas {
      display: block;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 110px);
      height: auto;
      background-color: #000;
      border: 2px solid #444;
    }

    #uiPanel {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
    }

    #selectedInfo {
      display: none;
      margin-top: 4px;
      font-weight: bold;
    }

    #levelBar {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .level-btn {
      width: 44px;
      height: 44px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }

    .level-btn:hover {
      border-color: #00f0ff;
    }

    .level-btn.active {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    #waveControls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .wave-btn,
    .speed-btn {
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 12px;
      padding: 6px 10px;
    }

    .wave-btn:hover,
    .speed-btn:hover {
      border-color: #00f0ff;
    }

    .wave-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .speed-btn.active {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    #towerBar {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 8px;
      border-radius: 8px;
    }

    .tower-btn {
      width: 52px;
      height: 52px;
      border: 2px solid #444;
      border-radius: 6px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .tower-btn:hover {
      border-color: #00f0ff;
    }

    .tower-btn.selected {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .tower-btn .key {
      font-size: 9px;
      color: #888;
    }

    .tower-btn .cost {
      font-size: 10px;
      color: #ffd700;
    }

    .level-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #techBtn {
      position: absolute;
      top: 62px;
      right: 10px;
      border: 2px solid #ffd700;
      border-radius: 6px;
      background: #1a1a2e;
      color: #ffd700;
      cursor: pointer;
      font-size: 12px;
      padding: 6px 10px;
    }

    #techBtn:hover {
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    #techPanel {
      position: absolute;
      top: 96px;
      right: 10px;
      width: 300px;
      max-height: 460px;
      overflow-y: auto;
      background: rgba(10, 10, 26, 0.95);
      border: 2px solid #ffd700;
      border-radius: 8px;
      padding: 12px;
      display: none;
      z-index: 10;
    }

    #techPanel.open {
      display: block;
    }

    #techPanel h3 {
      margin: 0 0 8px 0;
      color: #ffd700;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #techCloseBtn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 16px;
    }

    .tech-faction {
      margin-bottom: 10px;
    }

    .tech-faction-name {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tech-node {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 100%;
      text-align: left;
      border: 1px solid #444;
      border-radius: 5px;
      background: #1a1a2e;
      color: white;
      cursor: pointer;
      font-size: 11px;
      padding: 6px 8px;
      margin-bottom: 4px;
    }

    .tech-node:hover:not(:disabled) {
      border-color: #ffd700;
    }

    .tech-node.available {
      border-color: #ffd700;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    }

    .tech-node.unlocked {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.08);
      cursor: default;
    }

    .tech-node:disabled:not(.unlocked) {
      opacity: 0.45;
      cursor: default;
    }

    .tech-node-name {
      font-weight: bold;
    }

    .tech-node-desc {
      color: #aaa;
      font-size: 10px;
    }

    .tech-node-cost {
      color: #ffd700;
      font-size: 10px;
    }

    .tech-node.unlocked .tech-node-cost {
      color: #00ff88;
    }

    #saveControls {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      border-top: 1px solid #333;
      padding-top: 8px;
    }

    #saveControls button {
      flex: 1;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1a1a2e;
      color: #ccc;
      cursor: pointer;
      font-size: 10px;
      padding: 4px;
    }

    #saveControls button:hover {
      border-color: #00f0ff;
      color: white;
    }

    #saveMsg {
      margin-top: 6px;
      font-size: 11px;
      color: #00ff88;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="uiPanel">
      <div id="resources">Resources: 100</div>
      <div id="health">Health: 10</div>
      <div id="waveInfo">Wave: 0/0</div>
      <div id="techPoints">Tech: 0 pts</div>
      <div id="selectedInfo"></div>
    </div>
    <div id="levelBar">
      <button class="level-btn active" data-level="level1">1</button>
      <button class="level-btn" data-level="level2">2</button>
      <button class="level-btn" data-level="level3">3</button>
    </div>
    <button id="techBtn">⚡ Tech</button>
    <div id="techPanel">
      <h3>Tech Tree <button id="techCloseBtn" title="Close">✕</button></h3>
      <div id="techNodes"></div>
      <div id="saveControls">
        <button id="exportSaveBtn">Export</button>
        <button id="importSaveBtn">Import</button>
        <button id="resetSaveBtn">Reset</button>
      </div>
      <div id="saveMsg"></div>
    </div>
    <div id="waveControls">
      <button id="nextWaveBtn" class="wave-btn">Next Wave</button>
      <button class="speed-btn active" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="3">3x</button>
    </div>
    <div id="towerBar">
      <button class="tower-btn" data-type="laser" style="border-color:#00f0ff"><span class="key">1</span>Laser<span class="cost">80</span></button>
      <button class="tower-btn" data-type="plasma" style="border-color:#00a2ff"><span class="key">2</span>Plasma<span class="cost">100</span></button>
      <button class="tower-btn" data-type="railgun" style="border-color:#0066ff"><span class="key">3</span>Railgun<span class="cost">150</span></button>
      <button class="tower-btn" data-type="cannon" style="border-color:#ff6600"><span class="key">4</span>Cannon<span class="cost">90</span></button>
      <button class="tower-btn" data-type="missile" style="border-color:#ff3300"><span class="key">5</span>Missile<span class="cost">75</span></button>
      <button class="tower-btn" data-type="bomb" style="border-color:#cc0000"><span class="key">6</span>Bomb<span class="cost">110</span></button>
      <button class="tower-btn" data-type="emp" style="border-color:#9c27b0"><span class="key">7</span>EMP<span class="cost">70</span></button>
      <button class="tower-btn" data-type="pulse" style="border-color:#673ab7"><span class="key">8</span>Pulse<span class="cost">90</span></button>
      <button class="tower-btn" data-type="disruptor" style="border-color:#3f51b5"><span class="key">9</span>Disruptor<span class="cost">85</span></button>
      <button class="tower-btn" data-type="repair" style="border-color:#4CAF50"><span class="key">0</span>Repair<span class="cost">60</span></button>
    </div>
  </div>

  <!-- Include all JavaScript files -->
  <script src="core/game.js"></script>
  <script src="core/input.js"></script>
  <script src="entities/tower.js"></script>
  <script src="entities/enemy.js"></script>
  <script src="entities/projectile.js"></script>
  <script src="systems/waveManager.js"></script>
  <script src="systems/techTree.js"></script>
  <script src="systems/saveSystem.js"></script>
  <script src="content/levels.js"></script>
  <script src="render/renderer.js"></script>
  <script src="audio/audioManager.js"></script>
  <script src="main.js"></script>
</body>
</html>
