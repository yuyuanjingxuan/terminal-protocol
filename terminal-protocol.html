    // main.js - Main entry point
class TerminalProtocol {
  constructor() {
    this.game = null;
    this.inputHandler = null;
    this.audioManager = null;
    this.renderer = null;
  }

  init() {
    // Initialize game
    this.game = new Game();
    this.game.init('gameCanvas');

    // Initialize input handler
    this.inputHandler = new InputHandler(this.game);

    // Initialize audio manager
    this.audioManager = new AudioManager();

    // Initialize renderer
    this.renderer = new Renderer(this.game);

    // Load level
    this.loadLevel('level1');

    // Start game loop
    console.log('Terminal Protocol initialized');
  }

  loadLevel(levelName) {
    // Load level data
    const levelData = levels[levelName];
    if (!levelData) {
      console.error(`Level ${levelName} not found`);
      return;
    }

    // Set current level
    this.game.currentLevel = {
      name: levelData.name,
      path: levelData.path
    };

    // Setup wave manager
    const waveManager = this.game.waveManager;
    waveManager.reset();

    // Add waves
    levelData.waves.forEach(wave => {
      const waveEnemies = wave.map(enemyData => ({
        path: levelData.path
      }));
      waveManager.addWave(waveEnemies);
    });

    // Start first wave
    waveManager.startNextWave();
  }
}

// Initialize game when page loads
window.addEventListener('load', () => {
  const game = new TerminalProtocol();
  game.init();
});

// core/game.js - Game loop and state management
class Game {
  constructor() {
    this.canvas = null;
    this.ctx = null;
    this.lastTime = 0;
    this.deltaTime = 0;
    this.isRunning = false;
    this.currentLevel = null;
    this.towers = [];
    this.enemies = [];
    this.projectiles = [];
    this.resources = 100; // Starting resources
    this.health = 10; // Starting health
    this.waveManager = null;
  }

  init(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.waveManager = new WaveManager(this);
    this.isRunning = true;
    this.lastTime = performance.now();
    requestAnimationFrame(this.loop.bind(this));
  }

  loop(currentTime) {
    this.deltaTime = (currentTime - this.lastTime) / 1000;
    this.lastTime = currentTime;

    this.update(this.deltaTime);
    this.render();

    if (this.isRunning) {
      requestAnimationFrame(this.loop.bind(this));
    }
  }

  update(deltaTime) {
    // Update game state
    this.towers.forEach(tower => tower.update(deltaTime));
    this.enemies.forEach(enemy => enemy.update(deltaTime));
    this.projectiles.forEach(projectile => projectile.update(deltaTime));

    // Clean up dead entities
    this.enemies = this.enemies.filter(enemy => !enemy.isDead);
    this.projectiles = this.projectiles.filter(projectile => !projectile.isDead);

    // Check game over conditions
    if (this.health <= 0) {
      this.gameOver(false);
    }

    // Check wave completion
    if (this.waveManager.checkWavesComplete() && this.enemies.length === 0) {
      this.gameOver(true);
    }
  }

  render() {
    // Clear canvas
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    // Render game elements
    this.enemies.forEach(enemy => enemy.render(this.ctx));
    this.towers.forEach(tower => tower.render(this.ctx));
    this.projectiles.forEach(projectile => projectile.render(this.ctx));

    // Render UI
    this.renderUI();
  }

  renderUI() {
    // Draw resources and health
    this.ctx.fillStyle = 'white';
    this.ctx.font = '16px Arial';
    this.ctx.fillText(`Resources: ${this.resources}`, 10, 20);
    this.ctx.fillText(`Health: ${this.health}`, 10, 40);
  }

  gameOver(isWin) {
    this.isRunning = false;
    
    // Show game over message on canvas
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    
    ctx.fillStyle = isWin ? '#00ff88' : '#ff4444';
    ctx.font = '48px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      isWin ? 'LEVEL COMPLETE!' : 'GAME OVER',
      this.canvas.width / 2,
      this.canvas.height / 2
    );
    
    ctx.fillStyle = 'white';
    ctx.font = '24px Arial';
    ctx.fillText(
      isWin ? 'All waves defeated!' : 'The terminal was breached...',
      this.canvas.width / 2,
      this.canvas.height / 2 + 40
    );
    
    console.log(isWin ? 'Level Complete!' : 'Game Over!');
  }

  addTower(tower) {
    this.towers.push(tower);
  }

  addEnemy(enemy) {
    this.enemies.push(enemy);
  }

  addProjectile(projectile) {
    this.projectiles.push(projectile);
  }

  spendResources(amount) {
    if (this.resources >= amount) {
      this.resources -= amount;
      return true;
    }
    return false;
  }

  gainResources(amount) {
    this.resources += amount;
  }

  takeDamage(amount) {
    this.health -= amount;
  }
}

// core/input.js - Input handling
class InputHandler {
  constructor(game) {
    this.game = game;
    this.mouseX = 0;
    this.mouseY = 0;
    this.isMouseDown = false;
    this.setupEventListeners();
  }

  setupEventListeners() {
    // Mouse events
    this.game.canvas.addEventListener('mousemove', (e) => {
      const rect = this.game.canvas.getBoundingClientRect();
      this.mouseX = e.clientX - rect.left;
      this.mouseY = e.clientY - rect.top;
    });

    this.game.canvas.addEventListener('mousedown', (e) => {
      this.isMouseDown = true;
      this.handleMouseDown(e);
    });

    this.game.canvas.addEventListener('mouseup', (e) => {
      this.isMouseDown = false;
    });

    this.game.canvas.addEventListener('mouseleave', () => {
      this.isMouseDown = false;
    });
  }

  handleMouseDown(e) {
    // Check if clicking on a tower placement spot
    const gridSize = 40;
    const towerX = Math.floor(this.mouseX / gridSize) * gridSize + gridSize / 2;
    const towerY = Math.floor(this.mouseY / gridSize) * gridSize + gridSize / 2;

    // Check if this position is valid for tower placement
    if (this.isValidTowerPosition(towerX, towerY)) {
      // Create a basic tower for now
      const tower = new BasicTower(this.game, towerX, towerY);
      if (this.game.spendResources(tower.cost)) {
        this.game.addTower(tower);
      }
    }
  }

  isValidTowerPosition(x, y) {
    // Simple validation - not on the path for now
    // In a real implementation, this would check against the level's path
    return true;
  }
}

// entities/enemy.js - Base Enemy class
class Enemy {
  constructor(game, path) {
    this.game = game;
    this.path = path;
    this.pathIndex = 0;
    this.x = path[0].x;
    this.y = path[0].y;
    this.speed = 50; // pixels per second
    this.health = 30;
    this.maxHealth = 30;
    this.isDead = false;
    this.reward = 10; // resources rewarded when killed
  }

  update(deltaTime) {
    if (this.isDead) return;

    // Move along path
    if (this.pathIndex < this.path.length - 1) {
      const targetPoint = this.path[this.pathIndex + 1];
      const dx = targetPoint.x - this.x;
      const dy = targetPoint.y - this.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > 0) {
        const moveX = (dx / distance) * this.speed * deltaTime;
        const moveY = (dy / distance) * this.speed * deltaTime;

        this.x += moveX;
        this.y += moveY;

        // Check if we've reached the next point
        const newDistance = Math.sqrt(
          Math.pow(targetPoint.x - this.x, 2) + Math.pow(targetPoint.y - this.y, 2)
        );

        if (newDistance < 5) { // Close enough to next point
          this.pathIndex++;
        }
      }
    } else {
      // Reached the end - damage player
      this.game.takeDamage(1);
      this.isDead = true;
    }
  }

  takeDamage(amount) {
    this.health -= amount;
    if (this.health <= 0) {
      this.die();
    }
  }

  die() {
    this.isDead = true;
    this.game.gainResources(this.reward);
  }

  render(ctx) {
    // Draw enemy with neon effect
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Add glow effect
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;

    // Draw health bar
    const healthPercentage = this.health / this.maxHealth;
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(this.x - 10, this.y - 15, 20 * healthPercentage, 4);
  }
}

// entities/projectile.js - Projectile classes
class Projectile {
  constructor(game, startX, startY, targetX, targetY, damage) {
    this.game = game;
    this.x = startX;
    this.y = startY;
    this.targetX = targetX;
    this.targetY = targetY;
    this.damage = damage;
    this.speed = 300; // pixels per second
    this.isDead = false;
    this.color = 'yellow';

    // Calculate direction
    const dx = targetX - startX;
    const dy = targetY - startY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    this.velocityX = (dx / distance) * this.speed;
    this.velocityY = (dy / distance) * this.speed;
  }

  update(deltaTime) {
    this.x += this.velocityX * deltaTime;
    this.y += this.velocityY * deltaTime;

    // Check if reached target
    const distanceToTarget = Math.sqrt(
      Math.pow(this.targetX - this.x, 2) + Math.pow(this.targetY - this.y, 2)
    );

    if (distanceToTarget < 5) {
      this.hitTarget();
    }
  }

  hitTarget() {
    this.isDead = true;

    // Find enemy at target position and deal damage
    const enemies = this.game.enemies;
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      const distance = Math.sqrt(
        Math.pow(enemy.x - this.targetX, 2) + Math.pow(enemy.y - this.targetY, 2)
      );

      if (distance < 15) { // Close enough to be the target
        enemy.takeDamage(this.damage);
        break;
      }
    }
  }

  render(ctx) {
    // Draw projectile
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;
  }
}

class ExplosionProjectile extends Projectile {
  constructor(game, startX, startY, targetX, targetY, damage, explosionRadius) {
    super(game, startX, startY, targetX, targetY, damage);
    this.explosionRadius = explosionRadius;
    this.color = '#ff6600';
  }

  hitTarget() {
    this.isDead = true;

    // Find all enemies in explosion radius
    const enemies = this.game.enemies;
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      const distance = Math.sqrt(
        Math.pow(enemy.x - this.targetX, 2) + Math.pow(enemy.y - this.targetY, 2)
      );

      if (distance < this.explosionRadius) {
        enemy.takeDamage(this.damage);
      }
    }
  }

  render(ctx) {
    // Draw explosion projectile
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
    ctx.fill();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(255, 102, 0, 0.4)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;
  }
}

class LaserProjectile extends Projectile {
  constructor(game, startX, startY, targetX, targetY, damage) {
    super(game, startX, startY, targetX, targetY, damage);
    this.speed = 500; // Faster than regular projectiles
    this.color = '#00f0ff';
    this.width = 3;

    // Recalculate velocity with new speed
    const dx = targetX - startX;
    const dy = targetY - startY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    this.velocityX = (dx / distance) * this.speed;
    this.velocityY = (dy / distance) * this.speed;
  }

  render(ctx) {
    // Draw laser beam
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.width;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.velocityX * 0.1, this.y - this.velocityY * 0.1);
    ctx.stroke();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 12;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
    ctx.lineWidth = this.width + 2;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - this.velocityX * 0.1, this.y - this.velocityY * 0.1);
    ctx.stroke();

    // Reset shadow
    ctx.shadowBlur = 0;
  }
}

class EMPProjectile extends Projectile {
  constructor(game, startX, startY, targetX, targetY, damage, slowAmount, slowDuration) {
    super(game, startX, startY, targetX, targetY, damage);
    this.slowAmount = slowAmount;
    this.slowDuration = slowDuration;
    this.color = '#9c27b0';
  }

  hitTarget() {
    this.isDead = true;

    // Find enemy at target position and apply slow
    const enemies = this.game.enemies;
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      const distance = Math.sqrt(
        Math.pow(enemy.x - this.targetX, 2) + Math.pow(enemy.y - this.targetY, 2)
      );

      if (distance < 15) {
        enemy.takeDamage(this.damage);
        enemy.speed *= (1 - this.slowAmount);

        // Reset speed after duration
        setTimeout(() => {
          enemy.speed /= (1 - this.slowAmount);
        }, this.slowDuration * 1000);
        break;
      }
    }
  }

  render(ctx) {
    // Draw EMP projectile
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(156, 39, 176, 0.4)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;
  }
}

class PulseProjectile extends Projectile {
  constructor(game, startX, startY, radius, stunDuration) {
    super(game, startX, startY, startX, startY, 0);
    this.radius = radius;
    this.stunDuration = stunDuration;
    this.color = '#673ab7';
    this.speed = 0; // Doesn't move
    this.velocityX = 0;
    this.velocityY = 0;
    this.lifetime = 0.5; // seconds
    this.currentLifetime = 0;
  }

  update(deltaTime) {
    this.currentLifetime += deltaTime;

    if (this.currentLifetime >= this.lifetime) {
      this.hitTarget();
    }
  }

  hitTarget() {
    this.isDead = true;

    // Find all enemies in pulse radius and stun them
    const enemies = this.game.enemies;
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      const distance = Math.sqrt(
        Math.pow(enemy.x - this.x, 2) + Math.pow(enemy.y - this.y, 2)
      );

      if (distance < this.radius) {
        const originalSpeed = enemy.speed;
        enemy.speed = 0; // Stun

        // Reset speed after duration
        setTimeout(() => {
          enemy.speed = originalSpeed;
        }, this.stunDuration * 1000);
      }
    }
  }

  render(ctx) {
    // Draw pulse effect
    const progress = this.currentLifetime / this.lifetime;
    const currentRadius = this.radius * progress;

    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = 'rgba(103, 58, 183, 0.3)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Reset shadow
    ctx.shadowBlur = 0;
  }
}

class ChainProjectile extends Projectile {
  constructor(game, startX, startY, targetX, targetY, damage, chainTargets, chainDamage, range) {
    super(game, startX, startY, targetX, targetY, damage);
    this.chainTargets = chainTargets;
    this.chainDamage = chainDamage;
    this.range = range;
    this.chainCount = 0;
    this.color = '#3f51b5';
    this.chainedEnemies = [];
  }

  hitTarget() {
    this.chainedEnemies.push({x: this.targetX, y: this.targetY});
    this.chainCount++;

    // Damage current target
    const enemies = this.game.enemies;
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      const distance = Math.sqrt(
        Math.pow(enemy.x - this.targetX, 2) + Math.pow(enemy.y - this.targetY, 2)
      );

      if (distance < 15) {
        enemy.takeDamage(this.damage);
        break;
      }
    }

    // Find next target to chain to
    if (this.chainCount < this.chainTargets) {
      let closestEnemy = null;
      let closestDistance = this.range;

      enemies.forEach(enemy => {
        // Don't chain to already chained enemies
        const alreadyChained = this.chainedEnemies.some(
          pos => Math.sqrt(Math.pow(pos.x - enemy.x, 2) + Math.pow(pos.y - enemy.y, 2)) < 15
        );

        if (!alreadyChained) {
          const distance = Math.sqrt(
            Math.pow(enemy.x - this.targetX, 2) + Math.pow(enemy.y - this.targetY, 2)
          );

          if (distance < closestDistance) {
            closestDistance = distance;
            closestEnemy = enemy;
          }
        }
      });

      if (closestEnemy) {
        // Chain to next enemy
        this.targetX = closestEnemy.x;
        this.targetY = closestEnemy.y;
        this.damage *= this.chainDamage;

        // Recalculate direction
        const dx = this.targetX - this.x;
        const dy = this.targetY - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        this.velocityX = (dx / distance) * this.speed;
        this.velocityY = (dy / distance) * this.speed;
      } else {
        this.isDead = true;
      }
    } else {
      this.isDead = true;
    }
  }

  render(ctx) {
    // Draw chain lightning
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.targetX, this.targetY);
    ctx.stroke();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(63, 81, 181, 0.5)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.targetX, this.targetY);
    ctx.stroke();

    // Reset shadow
    ctx.shadowBlur = 0;

    // Draw chained positions
    this.chainedEnemies.forEach(pos => {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
  }
}

class RepairProjectile extends Projectile {
  constructor(game, startX, startY, targetX, targetY, repairAmount, repairDuration) {
    super(game, startX, startY, targetX, targetY, 0);
    this.repairAmount = repairAmount;
    this.repairDuration = repairDuration;
    this.color = '#4CAF50';
    this.speed = 400;

    // Recalculate velocity with new speed
    const dx = targetX - startX;
    const dy = targetY - startY;
    const distance = Math.sqrt(dx * dx + dy * dy);

    this.velocityX = (dx / distance) * this.speed;
    this.velocityY = (dy / distance) * this.speed;
  }

  hitTarget() {
    this.isDead = true;

    // Find tower at target position and repair it
    const towers = this.game.towers;
    for (let i = 0; i < towers.length; i++) {
      const tower = towers[i];
      const distance = Math.sqrt(
        Math.pow(tower.x - this.targetX, 2) + Math.pow(tower.y - this.targetY, 2)
      );

      if (distance < 15) {
        // Repair tower over time
        const repairInterval = setInterval(() => {
          // Tower doesn't have health yet, so we'll just add a visual effect
          // In a real implementation, this would repair tower health
        }, 1000);

        // Stop repairing after duration
        setTimeout(() => {
          clearInterval(repairInterval);
        }, this.repairDuration * 1000);
        break;
      }
    }
  }

  render(ctx) {
    // Draw repair beam
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.targetX, this.targetY);
    ctx.stroke();

    // Add glow effect
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 12;

    ctx.lineWidth = 5;

// entities/tower.js - Base Tower class
class Tower {
  constructor(game, x, y) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.range = 100;
    this.damage = 10;
    this.cooldown = 1; // seconds
    this.currentCooldown = 0;
    this.target = null;
    this.cost = 50;
  }

  update(deltaTime) {
    this.currentCooldown -= deltaTime;

    if (this.currentCooldown <= 0) {
      this.findTarget();
      if (this.target) {
        this.attack();
        this.currentCooldown = this.cooldown;
      }
    }
  }

  findTarget() {
    // Find closest enemy in range
    let closestEnemy = null;
    let closestDistance = this.range;

    this.game.enemies.forEach(enemy => {
      const distance = Math.sqrt(
        Math.pow(enemy.x - this.x, 2) + Math.pow(enemy.y - this.y, 2)
      );

      if (distance < closestDistance) {
        closestDistance = distance;
        closestEnemy = enemy;
      }
    });

    this.target = closestEnemy;
  }

  attack() {
    if (this.target) {
      // Create a projectile
      const projectile = new Projectile(
        this.game,
        this.x,
        this.y,
        this.target.x,
        this.target.y,
        this.damage
      );
      this.game.addProjectile(projectile);
    }
  }

  render(ctx) {
    // Draw tower base with neon effect
    ctx.fillStyle = '#00a2ff';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
    ctx.fill();

    // Add glow effect
    ctx.shadowColor = '#00a2ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(0, 162, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;

    // Draw range indicator (for debugging)
    ctx.strokeStyle = 'rgba(0, 162, 255, 0.2)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
    ctx.stroke();
  }
}

class BoostTower extends Tower {
  constructor(game, x, y) {
    super(game, x, y);
    this.damage = 0; // No direct damage
    this.cooldown = 1.0;
    this.range = 150;
    this.cost = 75;
    this.color = '#FFEB3B';
    this.boostAmount = 0.3; // 30% damage boost
    this.boostDuration = 5.0; // seconds
  }

  findTarget() {
    // Find closest tower in range to boost
    let closestTower = null;
    let closestDistance = this.range;

    this.game.towers.forEach(tower => {
      if (tower === this) return; // Don't target self

      const distance = Math.sqrt(
        Math.pow(tower.x - this.x, 2) + Math.pow(tower.y - this.y, 2)
      );

      if (distance < closestDistance) {
        closestDistance = distance;
        closestTower = tower;
      }
    });

    this.target = closestTower;
  }

  attack() {
    if (this.target) {
      // Apply boost to target tower
      this.target.damage *= (1 + this.boostAmount);
      this.target.color = '#FFEB3B'; // Change color to show boost

      // Reset boost after duration
      setTimeout(() => {
        this.target.damage /= (1 + this.boostAmount);
        // Reset color based on tower type
        if (this.target instanceof LaserTower) {
          this.target.color = '#00f0ff';
        } else if (this.target instanceof CannonTower) {
          this.target.color = '#ff6600';
        } else if (this.target instanceof EMPTower) {
          this.target.color = '#9c27b0';
        } else if (this.target instanceof RepairTower) {
          this.target.color = '#4CAF50';
        }
      }, this.boostDuration * 1000);
    }
  }

  render(ctx) {
    // Draw boost tower
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 16, 0, Math.PI * 2);
    ctx.fill();

          }
        }
      },
      'electromagnetic_3': {
        name: 'Chain Reaction',
        description: 'Chain lightning can jump to 1 additional target',
        cost: 150,
        unlocked: false,
        faction: 'electromagnetic',
        effect: (tower) => {
          if (tower instanceof DisruptorTower) {
            tower.chainTargets += 1;
          }
        }
      },
      
      // Support faction tech tree
      'support_1': {
        name: 'Efficient Repair',
        description: 'Repair towers heal 20% more health',
        cost: 50,
        unlocked: false,
        faction: 'support',
        effect: (tower) => {
          if (tower instanceof RepairTower) {
            tower.repairAmount *= 1.2;
          }
        }
      },
      'support_2': {
        name: 'Resource Optimization',
        description: 'Resource towers generate 25% more resources',
        cost: 100,
        unlocked: false,
        faction: 'support',
        effect: (tower) => {
          if (tower instanceof ResourceTower) {
            tower.resourceAmount *= 1.25;
          }
        }
      },
      'support_3': {
        name: 'Boost Amplification',
        description: 'Boost effects are 30% stronger',
        cost: 150,
        unlocked: false,
        faction: 'support',
        effect: (tower) => {
          if (tower instanceof BoostTower) {
            tower.boostAmount *= 1.3;
          }
        }
      },
      
      // Global upgrades
      'global_1': {
        name: 'Advanced Training',
        description: 'All towers cost 10% less to build',
        cost: 200,
        unlocked: false,
        faction: 'global',
        effect: (tower) => {
          // This would be applied when building towers
        }
      },
      'global_2': {
        name: 'Reinforced Structures',
        description: 'All towers gain +10% health (when implemented)',
        cost: 200,
        unlocked: false,
        faction: 'global',
        effect: (tower) => {
          // This would be applied when building towers
        }
      }
    };

    this.dependencies = {
      'energy_2': ['energy_1'],
      'energy_3': ['energy_2'],
      'explosive_2': ['explosive_1'],
      'explosive_3': ['explosive_2'],
      'electromagnetic_2': ['electromagnetic_1'],
      'electromagnetic_3': ['electromagnetic_2'],
      'support_2': ['support_1'],
      'support_3': ['support_2']
    };
  }

  unlockNode(nodeId) {
    const node = this.nodes[nodeId];
    
    if (!node) return false;
    
    // Check if node is already unlocked
    if (node.unlocked) return true;
    
    // Check dependencies
    if (this.dependencies[nodeId]) {
      for (const depId of this.dependencies[nodeId]) {
        if (!this.nodes[depId] || !this.nodes[depId].unlocked) {
          console.log(`Dependency ${depId} not unlocked`);
          return false;
        }
      }
    }
    
    // Check if player can afford it
    if (!this.game.spendResources(node.cost)) {
      return false;
    }
    
    // Unlock the node
    node.unlocked = true;
    
    // Apply effect to existing towers
    this.game.towers.forEach(tower => {
      node.effect(tower);
    });
    
    return true;
  }

  isNodeUnlocked(nodeId) {
    const node = this.nodes[nodeId];
    return node ? node.unlocked : false;
  }

  canUnlockNode(nodeId) {
    const node = this.nodes[nodeId];
    
    if (!node || node.unlocked) return false;
    
    // Check dependencies
    if (this.dependencies[nodeId]) {
      for (const depId of this.dependencies[nodeId]) {
        if (!this.nodes[depId] || !this.nodes[depId].unlocked) {
          return false;
        }
      }
    }
    
    // Check if player can afford it
    return this.game.resources >= node.cost;
  }

  getNodeInfo(nodeId) {
    return this.nodes[nodeId];
  }

  getAllNodes() {
    return this.nodes;
  }

  getNodesByFaction(faction) {
    return Object.fromEntries(
      Object.entries(this.nodes).filter(([id, node]) => node.faction === faction)
    );
  }

  reset() {
    Object.values(this.nodes).forEach(node => {
      node.unlocked = false;
    });
  }
}

        { cost: 180, resourceAmount: 30, cooldown: -3.0 }
      ]
    };
  }

  upgradeTower(tower, upgradeLevel) {
    const towerType = this.getTowerType(tower);
    
    if (!towerType || !this.upgrades[towerType] || !this.upgrades[towerType][upgradeLevel]) {
      return false;
    }

    const upgrade = this.upgrades[towerType][upgradeLevel];
    
    // Check if player can afford the upgrade
    if (!this.game.spendResources(upgrade.cost)) {
      return false;
    }

    // Apply upgrade
    if (upgrade.damage) tower.damage += upgrade.damage;
    if (upgrade.cooldown) tower.cooldown += upgrade.cooldown;
    if (upgrade.range) tower.range += upgrade.range;
    if (upgrade.explosionRadius) tower.explosionRadius += upgrade.explosionRadius;
    if (upgrade.slowAmount) tower.slowAmount += upgrade.slowAmount;
    if (upgrade.slowDuration) tower.slowDuration += upgrade.slowDuration;
    if (upgrade.stunDuration) tower.stunDuration += upgrade.stunDuration;
    if (upgrade.pulseRadius) tower.pulseRadius += upgrade.pulseRadius;
    if (upgrade.chainDamage) tower.chainDamage += upgrade.chainDamage;
    if (upgrade.chainTargets) tower.chainTargets += upgrade.chainTargets;
    if (upgrade.repairAmount) tower.repairAmount += upgrade.repairAmount;
    if (upgrade.repairDuration) tower.repairDuration += upgrade.repairDuration;
    if (upgrade.boostAmount) tower.boostAmount += upgrade.boostAmount;
    if (upgrade.boostDuration) tower.boostDuration += upgrade.boostDuration;
    if (upgrade.resourceAmount) tower.resourceAmount += upgrade.resourceAmount;

    return true;
  }

  getTowerType(tower) {
    if (tower instanceof LaserTower) return 'laser';
    if (tower instanceof PlasmaTower) return 'plasma';
    if (tower instanceof RailgunTower) return 'railgun';
    if (tower instanceof CannonTower) return 'cannon';
    if (tower instanceof MissileTower) return 'missile';
    if (tower instanceof BombTower) return 'bomb';
    if (tower instanceof EMPTower) return 'emp';
    if (tower instanceof PulseTower) return 'pulse';
    if (tower instanceof DisruptorTower) return 'disruptor';
    if (tower instanceof RepairTower) return 'repair';
    if (tower instanceof BoostTower) return 'boost';
    if (tower instanceof ResourceTower) return 'resource';
    
    return null;
  }

  getUpgradeInfo(towerType, upgradeLevel) {
    if (!this.upgrades[towerType] || !this.upgrades[towerType][upgradeLevel]) {
      return null;
    }
    
    return this.upgrades[towerType][upgradeLevel];
  }

  getMaxUpgradeLevel(towerType) {
    if (!this.upgrades[towerType]) {
      return 0;
    }
    
    return this.upgrades[towerType].length;
  }
}

// systems/waveManager.js - Wave management system
class WaveManager {
  constructor(game) {
    this.game = game;
    this.waves = [];
    this.currentWave = 0;
    this.waveTimer = 0;
    this.waveInterval = 5; // seconds between waves
    this.isWaveActive = false;
  }

  addWave(enemies) {
    this.waves.push(enemies);
  }

  startNextWave() {
    if (this.currentWave < this.waves.length) {
      this.isWaveActive = true;
      const waveEnemies = this.waves[this.currentWave];

      // Spawn all enemies in this wave
      waveEnemies.forEach(enemyData => {
        const enemy = new BasicEnemy(this.game, enemyData.path);
        this.game.addEnemy(enemy);
      });

      this.currentWave++;
    }
  }

  update(deltaTime) {
    if (!this.isWaveActive && this.currentWave < this.waves.length) {
      this.waveTimer += deltaTime;

      if (this.waveTimer >= this.waveInterval) {
        this.startNextWave();
        this.waveTimer = 0;
      }
    }
  }

  checkWavesComplete() {
    return this.currentWave >= this.waves.length;
  }

  reset() {
    this.currentWave = 0;
    this.waveTimer = 0;
    this.isWaveActive = false;
  }
}

// render/renderer.js - Rendering system
class Renderer {
  constructor(game) {
    this.game = game;
  }

  render() {
    const ctx = this.game.ctx;

    // Clear canvas
    ctx.clearRect(0, 0, this.game.canvas.width, this.game.canvas.height);

    // Render path
    this.renderPath();

    // Render entities
    this.game.enemies.forEach(enemy => enemy.render(ctx));
    this.game.towers.forEach(tower => tower.render(ctx));
    this.game.projectiles.forEach(projectile => projectile.render(ctx));

    // Render UI
    this.renderUI();
  }

  renderPath() {
    const ctx = this.game.ctx;
    const path = this.game.currentLevel.path;

    if (!path || path.length < 2) return;

    // Draw path with neon effect
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 25;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);

    for (let i = 1; i < path.length; i++) {
      ctx.lineTo(path[i].x, path[i].y);
    }

    ctx.stroke();

    // Add glow effect
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 30;
    ctx.beginPath();
    ctx.moveTo(path[0].x, path[0].y);

    for (let i = 1; i < path.length; i++) {
      ctx.lineTo(path[i].x, path[i].y);
    }

    ctx.stroke();

    // Reset shadow
    ctx.shadowBlur = 0;

    // Draw start and end points with neon effect
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(path[0].x, path[0].y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Add glow to start point
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(0, 255, 136, 0.5)';
    ctx.beginPath();
    ctx.arc(path[0].x, path[0].y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(path[path.length - 1].x, path[path.length - 1].y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Add glow to end point
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 15;
    ctx.fillStyle = 'rgba(255, 68, 68, 0.5)';
    ctx.beginPath();
    ctx.arc(path[path.length - 1].x, path[path.length - 1].y, 12, 0, Math.PI * 2);
    ctx.fill();

    // Reset shadow
    ctx.shadowBlur = 0;
  }

  renderUI() {
    const ctx = this.game.ctx;

    // Draw resources and health
    ctx.fillStyle = 'white';
    ctx.font = '16px Arial';
    ctx.fillText(`Resources: ${this.game.resources}`, 10, 20);
    ctx.fillText(`Health: ${this.game.health}`, 10, 40);

    // Draw wave info
    if (this.game.waveManager) {
      ctx.fillText(
        `Wave: ${this.game.waveManager.currentWave}/${this.game.waveManager.waves.length}`,
        10,
        60
      );
    }
  }
}

// audio/audioManager.js - Audio management system
class AudioManager {
  constructor() {
    this.audioContext = null;
    this.sounds = {};
    this.init();
  }

  init() {
    // Create audio context
    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();

    // Initialize sounds
    this.initSounds();
  }

  initSounds() {
    // Placeholder for sound initialization
    // In a real implementation, this would set up various sound effects
  }

  playSound(name) {
    if (this.sounds[name]) {
      const source = this.audioContext.createBufferSource();
      source.buffer = this.sounds[name];
      source.connect(this.audioContext.destination);
      source.start(0);
    }
  }

  playTowerBuilt() {
    // Simple beep sound for tower built
    if (!this.audioContext) return;

    const oscillator = this.audioContext.createOscillator();
    const gainNode = this.audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(this.audioContext.destination);

    oscillator.frequency.value = 800;
    gainNode.gain.value = 0.1;

    oscillator.start();
    oscillator.stop(this.audioContext.currentTime + 0.1);
  }

  playEnemyDie() {
    // Simple sound for enemy death
    if (!this.audioContext) return;

    const oscillator = this.audioContext.createOscillator();
    const gainNode = this.audioContext.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(this.audioContext.destination);

    oscillator.frequency.value = 300;
    gainNode.gain.value = 0.1;

    oscillator.start();
    oscillator.stop(this.audioContext.currentTime + 0.2);
  }
}
