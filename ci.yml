name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify planning document is present
        run: test -f docs/tower-defense-master-plan.md

      - name: Run build script if it exists
        run: |
          if [ -f scripts/build.js ]; then
            node scripts/build.js
          else
            echo "构建脚本 scripts/build.js 尚未创建，跳过合并构建检查。"
          fi

      - name: Run headless playability check if it exists
        run: |
          if [ -f scripts/verify.js ]; then
            node scripts/verify.js
          else
            echo "无界面浏览器验证脚本 scripts/verify.js 尚未创建，跳过。"
          fi
